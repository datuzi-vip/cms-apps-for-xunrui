{template "header.html"}

<form action="" class="form-horizontal" id="myform" method="post" name="myform">
    {$form}
    <div class="portlet bordered light myfbody">
        <div class="portlet-title tabbable-line">
            <ul class="nav nav-tabs" style="float:left;">
                <li class="{if $page==0}active{/if}">
                    <a data-toggle="tab" href="#tab_0" onclick="$('#dr_page').val('0')"> <i class="fa fa-cog"></i>
                        {dr_lang('插件设置')} </a>
                </li>
            </ul>
        </div>
        <div class="portlet-body">
            <div class="tab-content">
                <div class="tab-pane {if $page==0}active{/if}" id="tab_0">
                    <div class="form-body">
                        <div class="form-group">
                            <label class="col-md-2 control-label">{dr_lang('短信宝账号')}</label>
                            <div class="col-md-9">
                                <input class="form-control" name="data[user]" type="text" value="{$data.user}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">{dr_lang('短信宝密码')}</label>
                            <div class="col-md-9">
                                <input class="form-control" name="data[pass]" type="text" value="{$data.pass}">
                                <span class="help-block">{dr_lang('支持明文密码或32位ApiKey')}</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">{dr_lang('短信签名')}</label>
                            <div class="col-md-9">
                                <input class="form-control" name="data[sign]" placeholder="【我的网站】" type="text"
                                       value="{$data.sign}">
                                <span class="help-block">{dr_lang('需在短信宝后台审核通过')}</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-md-2 control-label">{dr_lang('验证码模板')}</label>
                            <div class="col-md-9">
                                <input class="form-control" name="data[code_tpl]"
                                       placeholder="您的验证码是{code}，30分钟内有效。" type="text"
                                       value="{$data.code_tpl}">
                                <span class="help-block">{dr_lang('{code} 为验证码占位符')}</span>
                            </div>
                        </div>
                        {if $data.user}
                        <div class="form-group">
                            <label class="col-md-2 control-label">{dr_lang('剩余短信')}</label>
                            <div class="col-md-9">
                                <div class="form-control-static" id="dr_sms">....</div>
                            </div>
                        </div>
                        {/if}
                    </div>
                </div>
            </div>
        </div>

        <div class="portlet-body form myfooter">
            <div class="form-actions text-center">
                <button class="btn green"
                        onclick="dr_ajax_submit('{dr_now_url()}&page='+$('#dr_page').val(), 'myform', '2000')"
                        type="button"><i class="fa fa-save"></i> {dr_lang('保存')}
                </button>
            </div>
        </div>
    </div>
</form>

<script type="text/javascript">
    $(function () {
        $.ajax({
            type: "GET",
            dataType: "json",
            url: "{dr_url('smsbao/config/balance_index')}",
            success: function (json) {
                if (json.code) {
                    $('#dr_sms').html(json.msg);
                } else {
                    $('#dr_sms').html('<span class="text-danger">' + json.msg + '</span>');
                }
            },
            error: function (HttpRequest, ajaxOptions, thrownError) {
                dr_ajax_alert_error(HttpRequest, this, thrownError);
            }
        });
    });
</script>

{template "footer.html"}
